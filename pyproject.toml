[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blocks"
version = "0.1.0"
description = "Apps as a graph of Python functions with UI blocks on top, run in the browser (Pyodide) and shipped as one offline HTML file."
requires-python = ">=3.11"
dependencies = ["playwright==1.64.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
blocks = "blocks.core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blocks = ["core/*.js", "core/page/*", "ui/*.js", "ui/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: runs the example apps in headless Chromium (slower)"]
